name: Deploy to Hostinger

on:
  push:
    branches:
      - main # Change this if your main branch has a different name

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install

      - name: Build the Next.js App
        run: npm run build

      - name: Export the Static Site
        run: npx next export

      - name: Zip the Exported Files
        run: zip -r out.zip ./out/

      - name: Deploy Zip via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          ftp_server: ftp://sunrisegold-tr.com
          ftp_username: ${{ secrets.FTP_USERNAME }}
          ftp_password: ${{ secrets.FTP_PASSWORD }}
          local_dir: ./ # Upload from root (so it picks up `out.zip`)
          remote_dir: /public_html/ # Change if needed

      - name: SSH into Server & Unzip (Optional)
        if: success()
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /public_html/
            unzip -o out.zip
            rm out.zip  # Delete zip after extraction
